version: '3.0'

services:
  minio-client-db:
    image: postgres:15
    container_name: minio-client-db
    user: root
    environment:
      POSTGRES_USER: 'admin'
      POSTGRES_PASSWORD: 'admin'
      POSTGRES_DB: 'minio-client-db'
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER
    ports:
      - '28073:5432'
    volumes:
      - ./.volumes/minio-client-db/pgdata:/var/lib/postgresql/data